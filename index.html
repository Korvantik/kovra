<script>
/* Korvantik: nothing is saved to the browser. Storage lives in memory only and is cleared on refresh or close.
   Only the test-mode flag (pp_test) uses real per-tab sessionStorage so test mode can reload into itself; it is cleared when the tab closes. */
(function(){var real=null;try{real=window.sessionStorage;real.getItem('pp_test')}catch(e){real=null}
function M(pass){var d={};var own=Object.prototype.hasOwnProperty;var A={getItem:function(k){k=String(k);if(pass&&k===pass&&real)return real.getItem(k);return own.call(d,k)?d[k]:null},setItem:function(k,v){k=String(k);v=String(v);if(pass&&k===pass&&real){real.setItem(k,v);return}d[k]=v},removeItem:function(k){k=String(k);if(pass&&k===pass&&real)real.removeItem(k);delete d[k]},clear:function(){Object.keys(d).forEach(function(k){delete d[k]});if(pass&&real)real.removeItem(pass)},key:function(i){var a=Object.keys(d);return i>=0&&i<a.length?a[i]:null}};return new Proxy(d,{get:function(t,k){if(k==='length')return Object.keys(t).length;if(typeof k==='string'&&own.call(A,k))return A[k];return t[k]},set:function(t,k,v){t[k]=String(v);return true}})}
try{Object.defineProperty(window,'localStorage',{value:M(),configurable:true,writable:true})}catch(e){}
try{Object.defineProperty(window,'sessionStorage',{value:M('pp_test'),configurable:true,writable:true})}catch(e){}})();
</script>
<script>
const $=s=>document.querySelector(s),fmt=n=>{try{return new Intl.NumberFormat(LC+'-u-nu-latn',{style:'currency',currency:CUR,minimumFractionDigits:FD(),maximumFractionDigits:FD()}).format(Number(n))}catch(e){return CUR+' '+Number(n).toFixed(2)}};
let tab='home',hide=false,CUR='USD',LC='en-US',LANG='en';
const cats=[{n:'Food',v:205.76,lim:300,c:'#f2c80f'},{n:'Travel',v:653.12,lim:500,c:'#e5301f'},{n:'Shopping',v:185.43,lim:400,c:'#3cae5c'},{n:'Dining',v:312.5,lim:260,c:'#e5301f'}];
const stat=c=>c.v>c.lim?'OVER LIMIT':c.v>c.lim*.6?'MODERATE':'NORMAL';
const days=[...Array(30)].map((_,i)=>Math.max(300,Math.round(4200+Math.sin(i/2.3)*1800+Math.cos(i*1.7)*900-(i>12?i*70:0)+((i*97)%13)*60)));
let bills=[],bn=0;
let goals=[{n:'New Laptop',t:1500,s:900,m:3},{n:'Vacation Fund',t:700,s:300,m:6}];
const income=3800,fixed=()=>bills.reduce((a,b)=>a+b.a,0);

function bars(c){let h='';for(let i=0;i<26;i++){const x=c.v/c.lim,hh=25+((i*37)%50)*(0.5+x/2);h+=`<span style="height:${Math.min(100,hh)}%;background:${c.c}"></span>`}return `<div class="bars">${h}</div>`}
function home(){return `
<div class="mut" style="margin-top:14px">Total Balance</div>
<div class="row"><div class="big" id="bal">${hide?CS()+' ••••••':fmt(balance)}</div><button class="go" style="border:0;background:none;color:var(--ink)" onclick="hide=!hide;render()">${hide?'🙈':'👁'}</button></div>
<div style="margin-top:8px;display:flex;gap:10px;align-items:center">${netChip()}</div>
<div class="act"><button onclick="openPay('send')">↗ Send</button><button class="qr" onclick="toast('Scan QR')">▦</button><button onclick="openPay('rcv')">↘ Receive</button></div>
<div class="card ai" onclick="openAI()"><div class="mut" style="color:var(--blue)">✦ AI Insight</div><div class="row" style="margin-top:6px"><div style="font-size:16px;font-weight:500">You're spending <b>12%</b> more on dining compared to last week</div><button class="go">→</button></div></div>
<div class="row sec"><h3>Monthly Spending Level</h3><span class="mut" style="cursor:pointer" onclick="go('insights')">More Details →</span></div>
<div class="cats">${cats.map(c=>`<div class="card cat">${c.n}${bars(c)}<b>${fmt(c.v)}</b><div class="st">${stat(c)}</div></div>`).join('')}</div>
<div class="card" style="margin-top:4px"><div class="row"><h3>Safe to spend</h3><span class="chip">${fmt((income-fixed()-goals.reduce((a,g)=>a+rec(g),0))/30)}/day</span></div><div class="mut" style="margin-top:6px">After upcoming bills (${fmt(fixed())}) and recommended savings, this is your daily flexible budget.</div></div>${activity()}`}

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let balance=0,flt='all',tid=10;
const F=['all','in','out','pending'],C=['Sarah K.','Ali R.','Mom','Jake M.'];
const today=()=>new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
let txs=[],_seed=[{id:1,dir:'in',n:'Acme Corp',a:3800,note:'Salary',d:'Oct 1',st:'done'},{id:2,dir:'out',n:'Sarah K.',a:45,note:'Dinner split',d:'Oct 9',st:'done'},{id:3,dir:'out',n:'City Utilities',a:96.4,note:'Electricity',d:'Oct 11',st:'done'},{id:4,dir:'in',n:'Ali R.',a:120,note:'Concert tickets',d:'Oct 13',st:'pending'}];
function txRow(t){const inc=t.dir==='in',p=t.st==='pending';return `<div class='card' style='padding:12px'><div class='row'><div style='display:flex;gap:12px;align-items:center;min-width:0'><div style='width:38px;height:38px;border-radius:50%;background:var(--blue-s);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none'>${esc(t.n[0].toUpperCase())}</div><div style='min-width:0'><b>${esc(t.n)}</b><div class='mut'>${esc(t.note||(inc?'Payment request':'Payment'))} · ${t.d}</div></div></div><div style='text-align:right;flex:none'><b style='color:${p?'var(--mut)':inc?'var(--grn)':'var(--red)'}'>${inc?'+':'−'}${fmt(t.a)}</b>${p?`<div class='mut'>Requested</div>`:''}</div></div>${p?`<div class='row' style='margin-top:10px;justify-content:flex-end'><button class='btn o' onclick='cancelTx(${t.id})'>Cancel</button><button class='btn' onclick='settle(${t.id})'>Mark received</button></div>`:''}</div>`}
function activity(){const sum=f=>txs.filter(f).reduce((a,t)=>a+t.a,0);const inn=sum(t=>t.dir==='in'&&t.st==='done'),out=sum(t=>t.dir==='out'),pen=sum(t=>t.st==='pending');const L=txs.filter(t=>flt==='all'||(flt==='pending'?t.st==='pending':t.dir===flt&&t.st==='done'));const f=(i,l)=>`<button class='btn ${flt===F[i]?'':'o'}' style='padding:6px 12px;font-size:13px' onclick='setF(${i})'>${l}</button>`;return `<div class='row sec' id='act'><h3>Activity</h3><span class='mut'>${txs.length} transactions</span></div><div class='hl'><div class='card' style='padding:12px'><div class='mut'>Received</div><b style='color:var(--grn);font-size:14px'>+${fmt(inn)}</b></div><div class='card' style='padding:12px'><div class='mut'>Sent</div><b style='color:var(--red);font-size:14px'>−${fmt(out)}</b></div><div class='card' style='padding:12px'><div class='mut'>Pending</div><b style='font-size:14px'>${fmt(pen)}</b></div></div><div style='display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap'>${f(0,'All')}${f(1,'Incoming')}${f(2,'Outgoing')}${f(3,'Pending')}</div>${L.length?L.map(txRow).join(''):`<div class='card mut' style='text-align:center'>Nothing here yet</div>`}`}
function setF(i){flt=F[i];render()}
function closeS(){$('#sheet').classList.remove('show')}
function pick(i){$('#pn').value=C[i]}
function openPay(m){const s=m==='send';$('#sbody').innerHTML=`<div class='row'><h3>${s?'Send money':'Request money'}</h3><button class='go xb' aria-label='Close' onclick='closeS()'></button></div><div class='mut' style='margin:6px 0 12px'>${s?'Choose who to pay. Your balance updates instantly.':'The request stays Pending until the payment arrives.'}</div><div style='display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px'>${C.map((n,i)=>`<button class='btn o' style='padding:6px 12px;font-size:13px' onclick='pick(${i})'>${n}</button>`).join('')}</div><input id='pn' placeholder='${s?'Send to':'Request from'} (name)'><input class='amt' id='pa' type='text' autocomplete='off' placeholder='Amount (${CS()})'><input id='pm' placeholder='Note (optional)'>${s?`<div class='mut' style='margin-bottom:10px'>Available: ${fmt(balance)}</div>`:''}<button class='btn' style='width:100%;padding:13px' onclick='submitPay(${s?1:0})'>${s?'Send payment':'Send request'}</button>`;$('#sheet').classList.add('show')}
function submitPay(s){const n=$('#pn').value.trim(),a=Math.round(NUM($('#pa').value)*100)/100,note=$('#pm').value.trim();if(!n)return toast('Enter a name');if(!(a>0))return toast('Enter an amount');if(s&&a>balance)return toast('Insufficient balance');if(s){balance-=a;txs.unshift({id:++tid,dir:'out',n,a,note,d:today(),st:'done'});toast('Sent '+fmt(a)+' to '+n)}else{txs.unshift({id:++tid,dir:'in',n,a,note,d:today(),st:'pending'});toast('Requested '+fmt(a)+' from '+n)}flt='all';closeS();render();const e=$('#act');if(e)e.scrollIntoView({block:'start'})}
function settle(id){const t=txs.find(x=>x.id===id);t.st='done';t.d=today();balance+=t.a;toast(fmt(t.a)+' received from '+t.n);render()}
function cancelTx(id){txs=txs.filter(x=>x.id!==id);toast('Request cancelled');render()}
const ic2={invoices:`<path d='M6 3h9l4 4v14H6z'/><path d='M9 12h7M9 16h7'/>`,audit:`<path d='M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'/><path d='M9 12l2 2 4-4'/>`};
let txn=0,invn=0,invs=[],log=[];
const R2=n=>Math.round(n*100)/100,pad=(n,l)=>String(n).padStart(l,'0');
const tsf=d=>d.toLocaleString(LC,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
let prof={name:'',role:'',biz:'',email:'',phone:'',img:'',ind:'',size:'',cur:'USD',lang:'en',done:false},nid=0,prefs={'TX-':true,INV:true,CUS:true},notes=[],customers=[],cusn=0,cq='',csel=-1;
const logE=(ref,msg)=>{const t=ref.slice(0,3),now=new Date();log.unshift({ts:now,ref,msg,by:(isEmp()&&empName()?empName()+' (employee)':isMgr()&&empName()?empName()+' (manager)':prof.name)});if(prefs[t]!==false)notes.unshift({id:++nid,ts:now,t,msg,read:false})};
bills.filter(b=>b.d<=7).forEach(b=>notes.push({id:++nid,ts:new Date(),t:'BIL',msg:b.n+' ('+fmt(b.a)+') is due in '+b.d+' days',read:false}));
notes.push({id:++nid,ts:new Date(),t:'SYS',msg:'Welcome to Kovra. Your ledger is empty. Record a receipt, add a customer or issue an invoice to get started.',read:false});
const invSt=i=>(i.st==='unpaid'||i.st==='partial')&&new Date(i.due+'T23:59:59')<new Date()?'overdue':i.st;
const chipS=s=>({paid:'background:var(--grn-s);color:var(--grn)',unpaid:'background:var(--blue-s);color:var(--blue)',overdue:'background:#fde3e0;color:var(--red)',void:'background:var(--line);color:var(--mut)',partial:'background:#fff3cf;color:#8a6500',refunded:'background:#efe3ff;color:#6b3fc4','part-refunded':'background:#efe3ff;color:#6b3fc4'}[s]);
function addTx(dir,n,a,note,inv){balance=R2(balance+(dir==='in'?a:-a));const id='TX-'+pad(++txn,4);txs.push({id,dir,n,a,note,inv:inv||'',ts:new Date(),bal:balance});logE(id,(dir==='in'?'Received ':'Sent ')+fmt(a)+(dir==='in'?' from ':' to ')+n+(note?' ('+note+')':'')+'. Balance '+fmt(balance));return id}
function netChip(){const net=R2(txs.reduce((s,t)=>s+(t.dir==='in'?t.a:-t.a),0));return `<span class='chip' style='${net<0?'background:#fde3e0;color:var(--red)':''}'>${net<0?'↘':'↗'} ${fmt(Math.abs(net))}</span><span class='mut'>${txs.length?'Net cash flow since opening':'No transactions recorded yet'}</span>`}
function txRow2(t){const inc=t.dir==='in';return `<div class='card' style='padding:12px'><div class='row'><div style='min-width:0'><b>${esc(t.n)}</b><div class='mut'>${t.id}${t.inv?' · '+t.inv:''} · ${tsf(t.ts)}</div>${t.note?`<div class='mut'>${esc(t.note)}</div>`:''}</div><div style='text-align:right;flex:none'><b style='color:${inc?'var(--grn)':'var(--red)'}'>${inc?'+':'−'}${fmt(t.a)}</b><div class='mut'>Bal ${fmt(t.bal)}</div></div></div></div>`}
function goA(){go('audit')}
function activity(){const L=[...txs].reverse().slice(0,5);return `<div class='row sec'><h3>Recent activity</h3><span class='mut' style='cursor:pointer' onclick='goA()'>Full ledger →</span></div>${L.length?L.map(txRow2).join(''):`<div class='card mut' style='text-align:center'>No activity yet. Record a payment with Receive or Send, or create an invoice.</div>`}`}
function openPay(m){const s=m==='send';$('#sbody').innerHTML=`<div class='row'><h3>${s?'Send money':'Receive money'}</h3><button class='go xb' aria-label='Close' onclick='closeS()'></button></div><div class='mut' style='margin:6px 0 12px'>${s?'Posts to the ledger instantly and cannot be edited.':'Log a payment you have received. It posts to the ledger immediately.'}</div><div style='display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px'>${C.map((n,i)=>`<button class='btn o' style='padding:6px 12px;font-size:13px' onclick='pick(${i})'>${n}</button>`).join('')}</div><input id='pn' placeholder='${s?'Send to':'Received from'} (name)'><input class='amt' id='pa' type='text' autocomplete='off' placeholder='Amount (${CS()})'><input id='pm' placeholder='Reference / note'>${s?`<div class='mut' style='margin-bottom:10px'>Available: ${fmt(balance)}</div>`:''}<button class='btn' style='width:100%;padding:13px' onclick='submitPay(${s?1:0})'>${s?'Send payment':'Record receipt'}</button>`;$('#sheet').classList.add('show')}
function submitPay(s){const n=$('#pn').value.trim(),a=R2(NUM($('#pa').value)),note=$('#pm').value.trim();if(!n)return toast('Enter a name');if(!(a>0))return toast('Enter an amount');if(s&&a>balance)return toast('Insufficient balance – record a receipt first');const id=addTx(s?'out':'in',n,a,note);closeS();toast(id+' posted');render()}
function openInv(){const d=new Date(Date.now()+12096e5).toISOString().slice(0,10);$('#sbody').innerHTML=`<div class='row'><h3>New invoice</h3><button class='go xb' aria-label='Close' onclick='closeS()'></button></div><div class='mut' style='margin:6px 0 12px'>Invoice numbers are sequential and every change is logged.</div><input id='ic' placeholder='Client name'><input id='ide' placeholder='Description'><input id='ia' type='number' inputmode='decimal' placeholder='Amount (${CS()})'><div class='mut' style='margin-bottom:4px'>Due date</div><input id='iu' type='date' value='${d}'><button class='btn' style='width:100%;padding:13px' onclick='submitInv()'>Issue invoice</button>`;$('#sheet').classList.add('show')}
function submitInv(){const client=$('#ic').value.trim(),desc=$('#ide').value.trim(),a=R2(NUM($('#ia').value)),due=$('#iu').value;if(!client)return toast('Enter a client');if(!(a>0))return toast('Enter an amount');if(!due)return toast('Pick a due date');const id='INV-'+pad(++invn,3);invs.unshift({id,client,desc,a,due,ts:new Date(),st:'unpaid'});logE(id,'Invoice issued to '+client+' for '+fmt(a)+', due '+due);closeS();toast(id+' issued');go('invoices')}
function payInv(k){const i=invs[k];i.st='paid';i.tx=addTx('in',i.client,i.a,i.desc,i.id);logE(i.id,'Marked paid, posted as '+i.tx);toast(i.id+' paid');render()}
function voidInv(k){const i=invs[k];i.st='void';logE(i.id,'Invoice voided (was '+fmt(i.a)+' to '+i.client+')');toast(i.id+' voided');render()}
function invView(){const u=invs.filter(i=>i.st==='unpaid'),out=R2(u.reduce((s,i)=>s+i.a,0)),od=u.filter(i=>invSt(i)==='overdue').length,pd=R2(invs.filter(i=>i.st==='paid').reduce((s,i)=>s+i.a,0));return `<div class='card' style='margin-top:12px'><div class='mut'>Outstanding invoices</div><h3 style='font-size:28px;margin:4px 0'>${fmt(out)}</h3><div class='mut'>${u.length} unpaid · ${od} overdue · ${fmt(pd)} collected</div><button class='btn' style='margin-top:12px' onclick='openInv()'>+ New invoice</button></div><div class='sec'><h3>Invoices</h3></div>${invs.length?invs.map((i,k)=>{const s=invSt(i);return `<div class='card'><div class='row'><div style='min-width:0'><b>${i.id} · ${esc(i.client)}</b><div class='mut'>${esc(i.desc||'No description')}</div><div class='mut'>Issued ${tsf(i.ts)} · Due ${i.due}</div>${i.tx?`<div class='mut'>Posted as ${i.tx}</div>`:''}</div><div style='text-align:right;flex:none'><b>${fmt(i.a)}</b><div><span class='chip' style='${chipS(s)};font-size:11px;padding:2px 9px'>${s}</span></div></div></div>${i.st==='unpaid'?`<div class='row' style='margin-top:10px;justify-content:flex-end'><button class='btn o' onclick='voidInv(${k})'>Void</button><button class='btn' onclick='payInv(${k})'>Mark paid</button></div>`:''}</div>`}).join(''):`<div class='card mut' style='text-align:center'>No invoices yet. Issue one to start tracking what you are owed.</div>`}`}
function copyCsv(){const Q=String.fromCharCode(34),q=s=>Q+String(s).split(Q).join(Q+Q)+Q;const csv=['ref,date,direction,party,invoice,note,amount,balance',...txs.map(t=>[t.id,t.ts.toISOString(),t.dir,q(t.n),t.inv,q(t.note),t.a,t.bal].join(','))].join(String.fromCharCode(10));try{navigator.clipboard.writeText(csv).then(()=>toast('Ledger CSV copied'),()=>toast('Copy blocked by browser'))}catch(e){toast('Copy not available')}}
function auditView(){const inn=R2(txs.filter(t=>t.dir==='in').reduce((s,t)=>s+t.a,0)),out=R2(txs.filter(t=>t.dir==='out').reduce((s,t)=>s+t.a,0)),ok=R2(inn-out)===balance;return `<div class='card' style='margin-top:12px'><div class='row'><h3>Reconciliation</h3><span class='chip' style='${ok?'':'background:#fde3e0;color:var(--red)'}'>${ok?'✓ Balanced':'Mismatch'}</span></div><div class='row' style='margin-top:10px'><span class='mut'>Total received</span><b>${fmt(inn)}</b></div><div class='row'><span class='mut'>Total sent</span><b>${fmt(out)}</b></div><div class='row'><span class='mut'>Ledger balance</span><b>${fmt(balance)}</b></div><div class='mut' style='font-size:12px;margin-top:10px'>Log a payment made or received outside the app. Kovra records transactions and never moves money.</div><div class='row' style='justify-content:flex-start;flex-wrap:wrap;margin-top:10px'><button class='btn' onclick='payIn()'>Record money in</button><button class='btn o' onclick='payOut()'>Record money out</button></div><button class='btn o' style='margin-top:10px' onclick='copyCsv()'>Copy ledger as CSV</button></div><div class='sec'><h3>Ledger</h3></div>${txs.length?[...txs].reverse().map(txRow2).join(''):`<div class='card mut' style='text-align:center'>The ledger is empty.</div>`}<div class='sec'><h3>Audit trail</h3></div><div class='card'>${log.length?log.map(e=>`<div style='padding:8px 0;border-bottom:1px solid var(--line);font-size:13px'><b>${e.ref}</b> <span class='mut'>${tsf(e.ts)} · ${esc(e.by||'')}</span><div>${esc(e.msg)}</div></div>`).join(''):`<div class='mut'>No events recorded yet.</div>`}</div>`}
ic2.customers=`<circle cx='9' cy='8' r='3.5'/><path d='M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 010 6.4M18 14.5c2 .7 3.5 2.5 3.5 5.5'/>`;

function openPay(m){const s=m==='send';$('#sbody').innerHTML=`<div class='row'><h3>${s?'Record money out':'Record money in'}</h3><button class='go xb' aria-label='Close' onclick='closeS()'></button></div><div class='mut' style='margin:6px 0 12px'>Kovra does not move money. Log a payment you ${s?'made':'received'} outside the app so your ledger stays complete. Entries cannot be edited. Tip: you can type math in the amount, like 1200/3 or 500-120.</div><div style='display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px'>${C.map((n,i)=>`<button class='btn o' style='padding:6px 12px;font-size:13px' onclick='pick(${i})'>${n}</button>`).join('')}</div><input id='pn' placeholder='${s?'Paid to':'Received from'} (name)'><input class='amt' id='pa' type='text' autocomplete='off' placeholder='Amount (${CS()})'><input id='pm' placeholder='Reference / note'><button class='btn' style='width:100%;padding:13px' onclick='submitPay(${s?1:0})'>Record payment ${s?'out':'in'}</button>`;$('#sheet').classList.add('show')}
function submitPay(s){const n=$('#pn').value.trim(),a=R2(NUM($('#pa').value)),note=$('#pm').value.trim();if(!n)return toast('Enter a name');if(!(a>0))return toast('Enter an amount');const id=addTx(s?'out':'in',n,a,note,'',cidOf(n));closeS();toast(id+' recorded');render()}
function readItems(){return [...document.querySelectorAll('#lines .ln')].map(r=>({name:r.querySelector('.ln-n').value.trim(),sku:r.querySelector('.ln-s').value.trim(),qty:NUM(r.querySelector('.ln-q').value),price:NUM(r.querySelector('.ln-p').value)})).filter(x=>x.name||x.sku||!isNaN(x.price))}
function calcT(){const t=totals(readItems(),discAmt($('#idc').value,totals(readItems(),0,0).sub),NUM($('#itx').value)||0);$('#itot').innerHTML=`Subtotal ${fmt(t.sub)} · Tax ${fmt(t.tax)} · <b>Total ${fmt(t.total)}</b>`}
function addRow(){$('#lines').insertAdjacentHTML('beforeend',`<div class='ln' style='display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)'><input class='ln-n' placeholder='Product / service name' oninput='calcT()'><input class='ln-s' placeholder='SKU (optional)'><input class='ln-q' type='number' step='any' value='1' placeholder='Qty' oninput='calcT()'><input class='ln-p amt' type='text' autocomplete='off' placeholder='Unit price (${CS()})' oninput='calcT()'><button class='btn o' style='grid-column:1/3;padding:6px' onclick='this.parentNode.remove();calcT()'>Remove line</button></div>`)}
function openInv(cid){const td=new Date().toISOString().slice(0,10),d=new Date(Date.now()+12096e5).toISOString().slice(0,10),cs=customers.filter(c=>!c.archived);$('#sbody').innerHTML=`<div class='row'><h3>New invoice</h3><button class='go xb' aria-label='Close' onclick='closeS()'></button></div><div class='mut' style='margin:6px 0 12px'>Numbers are sequential. Issued invoices can't be edited, only paid, refunded or voided.</div><div class='mut'>Name</div><select id='isel' style='${SEL}' onchange='togIc()'>${cs.map(c=>`<option value='${c.id}'>${esc(c.name)}</option>`).join('')}<option value=''>Other (new client)</option></select><input id='ic' placeholder='Client name'><div class='mut'>Invoice date</div><input id='iis' type='date' value='${td}'><div class='mut'>Due date</div><input id='iu' type='date' value='${d}'><h3 style='margin:8px 0'>Line items</h3>${products.length?`<select id='ipk' style='${SEL}' onchange='addFromProd()'><option value=''>+ Add from products...</option>${products.map((p,k)=>pkOpts(p,k)).join('')}</select>`:''}<div id='lines'></div><button class='btn o' onclick='addRow()' style='margin-bottom:12px'>+ Add line</button><input id='idc' type='text' autocomplete='off' placeholder='Discount: amount or % (e.g. 10%)' oninput='calcT()'><input id='itx' type='number' step='any' placeholder='Tax rate (%, optional)' oninput='calcT()'><input id='ino' placeholder='Notes / payment terms (optional)'><div id='itot' class='mut' style='margin:6px 0 12px'></div><button class='btn' style='width:100%;padding:13px' onclick='submitInv()'>Issue invoice</button>`;if(cid)$('#isel').value=cid;togIc();addRow();calcT();$('#sheet').classList.add('show')}
function submitInv(){const sel=$('#isel').value,cu=customers.find(c=>c.id===sel),typed=$('#ic').value.trim(),client=cu?cu.name:typed,cid=cu?cu.id:cidOf(typed),items=readItems(),disc=discAmt($('#idc').value,totals(readItems(),0,0).sub),tx=NUM($('#itx').value)||0,due=$('#iu').value,issued=$('#iis').value;if(!client)return toast('Choose or enter a client');if(!items.length)return toast('Add at least one line item');if(items.some(x=>!x.name&&!x.sku))return toast('Each line needs a name or SKU');if(items.some(x=>!(x.qty>0)||!(x.price>=0)))return toast('Check quantity and price on each line');if(!due||!issued)return toast('Pick the dates');if(due<issued)return toast('Due date is before the invoice date');const lack=lacks(items);if(lack)return toast('Not enough stock for '+(lack.name||lack.sku));const t=totals(items,disc,tx);if(!(t.total>0))return toast('Invoice total must be above zero');const id='INV-'+pad(++invn,3),desc=items.map(x=>x.name||x.sku).join(', ').slice(0,70);invs.unshift({id,client,cid,desc,items,disc,taxRate:tx,notes:$('#ino').value.trim(),issued,due,ts:new Date(),st:'unpaid',pays:[],refs:[],voided:false,a:t.total});stockOut(items);logE(id,'Invoice issued to '+client+' for '+fmt(t.total)+' ('+items.length+' line'+(items.length>1?'s':'')+'), due '+due);closeS();toast(id+' issued');isel=0;go('invoice')}
function invView(){const act=invs.filter(i=>i.st==='unpaid'||i.st==='partial'),owed=R2(act.reduce((s,i)=>s+dueAmt(i),0)),od=act.filter(i=>invSt(i)==='overdue').length,col=R2(invs.reduce((s,i)=>s+paidAmt(i)-refAmt(i),0));return `<div class='card' style='margin-top:12px'><div class='mut'>Outstanding invoices</div><h3 style='font-size:28px;margin:4px 0'>${fmt(owed)}</h3><div class='mut'>${act.length} open · ${od} overdue · ${fmt(col)} collected (net)</div><button class='btn' style='margin-top:12px' onclick='openInv()'>+ New invoice</button></div><div class='sec'><h3>Invoices</h3></div>${invs.length?invs.map((i,k)=>{const s=invSt(i),d=dueAmt(i);return `<div class='card' style='cursor:pointer' onclick='openIv(${k})'><div class='row'><div style='min-width:0'><b>${i.id} · ${esc(i.client)}</b><div class='mut'>${i.items.length} item${i.items.length>1?'s':''} · Due ${i.due}</div><div class='mut'>${esc(i.desc)}</div></div><div style='text-align:right;flex:none'><b>${fmt(i.a)}</b><div><span class='chip' style='${chipS(s)};font-size:11px;padding:2px 9px'>${s}</span></div>${d>0&&d<i.a?`<div class='mut'>${fmt(d)} due</div>`:''}</div></div></div>`}).join(''):`<div class='card mut' style='text-align:center'>No invoices yet. Issue one with product or service lines, SKUs and tax.</div>`}`}
function invHtml(i){const c=customers.find(x=>x.id===i.cid),t=totals(i.items,i.disc,i.taxRate),s=invSt(i),rows=i.items.map(it=>`<tr><td>${esc(it.name||'—')}${it.sku?`<div class='sk'>SKU ${esc(it.sku)}</div>`:''}</td><td class='r'>${it.qty}</td><td class='r'>${fmt(it.price)}</td><td class='r'>${fmt(R2(it.qty*it.price))}</td></tr>`).join(''),pays=i.pays.map(p=>`<div><span>Payment · ${tsf(p.ts)} · ${esc(p.method)}${p.ref?' · '+esc(p.ref):''}</span><span>−${fmt(p.a)}</span></div>`).join(''),refs=i.refs.map(r=>`<div><span>Refund · ${tsf(r.ts)}${r.reason?' · '+esc(r.reason):''}</span><span>+${fmt(r.a)}</span></div>`).join('');return `<div style='display:flex;justify-content:space-between;gap:10px'><div><div style='font-weight:700;font-size:16px'>${esc(prof.biz||prof.name)}</div>${bizSub()}</div><div style='text-align:right'><div style='font-size:20px;font-weight:800;letter-spacing:1px'>INVOICE</div><div>${i.id}</div></div></div><div style='display:flex;justify-content:space-between;gap:10px;margin:14px 0'><div><div class='sk'>BILL TO</div><b>${esc(i.client)}</b>${c&&c.company?`<div>${esc(c.company)}</div>`:''}${c&&c.email?`<div class='sk'>${esc(c.email)}</div>`:''}${c&&c.phone?`<div class='sk'>${esc(c.phone)}</div>`:''}</div><div style='text-align:right'><div class='sk'>ISSUED</div>${i.issued}<div class='sk' style='margin-top:4px'>DUE</div>${i.due}<div style='margin-top:6px'><b class='stp'>${s.toUpperCase()}</b></div></div></div><table><tr><th>Item</th><th class='r'>Qty</th><th class='r'>Price</th><th class='r'>Amount</th></tr>${rows}</table><div class='tot'><div><span>Subtotal</span><span>${fmt(t.sub)}</span></div>${i.disc?`<div><span>Discount</span><span>−${fmt(i.disc)}</span></div>`:''}${i.taxRate?`<div><span>Tax (${i.taxRate}%)</span><span>${fmt(t.tax)}</span></div>`:''}<div style='font-weight:700;font-size:15px'><span>Total</span><span>${fmt(i.a)}</span></div>${pays}${refs}<div style='font-weight:700'><span>Balance due</span><span>${fmt(dueAmt(i))}</span></div></div>${payBlock(i)}${i.notes?`<div style='margin-top:12px'><div class='sk'>NOTES</div>${esc(i.notes)}</div>`:''}<div class='sk' style='margin-top:14px'>Generated by Kovra. This is a billing record; Kovra does not process payments.</div>`}
function invText(i){const c=customers.find(x=>x.id===i.cid),t=totals(i.items,i.disc,i.taxRate),L=[];L.push((prof.biz||prof.name)+' - INVOICE '+i.id,'Status: '+invSt(i),'Issued: '+i.issued+'   Due: '+i.due,'Bill to: '+i.client+(c&&c.company?' ('+c.company+')':'')+(c&&c.email?' <'+c.email+'>':''),'');i.items.forEach(it=>L.push('- '+(it.name||'')+(it.sku?' [SKU '+it.sku+']':'')+'  '+it.qty+' x '+fmt(it.price)+' = '+fmt(R2(it.qty*it.price))));L.push('','Subtotal: '+fmt(t.sub));if(i.disc)L.push('Discount: -'+fmt(i.disc));if(i.taxRate)L.push('Tax ('+i.taxRate+'%): '+fmt(t.tax));L.push('Total: '+fmt(i.a));i.pays.forEach(p=>L.push('Payment recorded ('+p.method+'): '+fmt(p.a)));i.refs.forEach(r=>L.push('Refund recorded: '+fmt(r.a)+(r.reason?' ('+r.reason+')':'')));L.push('Balance due: '+fmt(dueAmt(i)));if(!i.voided&&dueAmt(i)>0&&(prof.bankName||prof.acctNo))L.push('','Pay to: '+[prof.bankName,prof.acctName,prof.acctNo,prof.acctExtra].filter(Boolean).join(' | '),'Reference: '+i.id);if(i.notes)L.push('','Notes: '+i.notes);return L.join(NL)}
function copyInv(k){try{navigator.clipboard.writeText(invText(invs[k])).then(()=>toast('Invoice copied'),()=>toast('Copy blocked by browser'))}catch(e){toast('Copy not available')}}

function invPage(){const i=invs[isel];if(!i)return invView();const d=dueAmt(i),canVoid=!i.voided&&!i.pays.length,hist=log.filter(e=>e.ref===i.id||i.pays.concat(i.refs).some(p=>p.tx===e.ref));return `<div style='margin-top:12px'><button class='btn o' onclick='goI()'>← Invoices</button></div><div class='paper' style='margin-top:12px'>${invHtml(i)}</div><div class='row' style='margin:12px 0;justify-content:flex-start;flex-wrap:wrap'>${!i.voided&&d>0?`<button class='btn' onclick='openRecPay(${isel})'>Record payment</button>`:''}${refundable(i)>0?`<button class='btn o' onclick='openRefund(${isel})'>Refund</button>`:''}<button class='btn o' onclick='printInv(${isel})'>Print / Save PDF</button><button class='btn o' onclick='copyInv(${isel})'>Copy</button>${canVoid?`<button class='btn o' onclick='voidInv(${isel})'>Void</button>`:''}</div><div class='card'><h3 style='margin-bottom:6px'>Invoice history</h3>${hist.map(e=>`<div style='padding:6px 0;border-bottom:1px solid var(--line);font-size:13px'><b>${e.ref}</b> <span class='mut'>${tsf(e.ts)}</span><div>${esc(e.msg)}</div></div>`).join('')}</div>`}
function openRecPay(k){const i=invs[k];$('#sbody').innerHTML=`<div class='row'><h3>Record payment · ${i.id}</h3><button class='go xb' aria-label='Close' onclick='closeS()'></button></div><div class='mut' style='margin:6px 0 12px'>Log a payment received outside the app. Balance due: ${fmt(dueAmt(i))}. Tip: you can type math in the amount, like 1200/3 or 500-120.</div><input class='amt' id='rpa' type='text' autocomplete='off' placeholder='Amount (${CS()})'><select id='rpm' style='${SEL}'>${['Bank transfer','Card','Cash','Cheque','Other'].map(m=>`<option>${m}</option>`).join('')}</select><input id='rpr' placeholder='Reference (optional)'><button class='btn' style='width:100%;padding:13px' onclick='submitRecPay(${k})'>Record payment</button>`;$('#rpa').value=dueAmt(i);$('#sheet').classList.add('show')}
function submitRecPay(k){const i=invs[k],a=R2(NUM($('#rpa').value)),m=$('#rpm').value,ref=$('#rpr').value.trim();if(!(a>0))return toast('Enter an amount');if(a>dueAmt(i))return toast('Amount exceeds the balance due');const tx=addTx('in',i.client,a,i.id+' payment ('+m+(ref?', ref '+ref:'')+')',i.id,i.cid);i.pays.push({tx,a,method:m,ref,ts:new Date()});setSt(i);logE(i.id,'Paid by '+i.client+', posted as '+tx+' ('+fmt(a)+', '+m+')'+(i.st==='paid'?'. Invoice fully paid':''));closeS();toast(i.id+(i.st==='paid'?' paid in full':' payment recorded'));render()}
function openRefund(k){const i=invs[k];$('#sbody').innerHTML=`<div class='row'><h3>Refund · ${i.id}</h3><button class='go xb' aria-label='Close' onclick='closeS()'></button></div><div class='mut' style='margin:6px 0 12px'>Record a refund you issued outside the app. It posts as money out. Refundable: ${fmt(refundable(i))}. Tip: you can type math in the amount, like 1200/3 or 500-120.</div><input id='rfa' type='text' autocomplete='off' placeholder='Refund: amount or % (e.g. 25%)' oninput="$('#rfx').textContent=fmt(pctOf(this.value,${refundable(i)})||0)"><div class='mut' style='margin:-4px 0 8px'>Refund amount: <b id='rfx'>${fmt(refundable(i))}</b></div><select id='rfr' style='${SEL}'>${['Customer request','Returned item or service','Billing error','Duplicate payment','Other'].map(m=>`<option>${m}</option>`).join('')}</select><input id='rfn' placeholder='Note (optional)'><button class='btn' style='width:100%;padding:13px' onclick='submitRefund(${k})'>Record refund</button>`;$('#rfa').value=refundable(i);$('#sheet').classList.add('show')}
function submitRefund(k){const i=invs[k],a=pctOf($('#rfa').value,refundable(i)),n=$('#rfn').value.trim(),reason=$('#rfr').value+(n?': '+n:'');if(!(a>0))return toast('Enter an amount');if(a>refundable(i))return toast('Amount exceeds what was paid');const tx=addTx('out',i.client,a,'Refund '+i.id+' - '+reason,i.id,i.cid,'refund');i.refs.push({tx,a,reason,ts:new Date()});setSt(i);logE(i.id,'Refund of '+fmt(a)+' recorded ('+reason+'), posted as '+tx+(i.st==='refunded'?'. Invoice fully refunded':''));closeS();toast(i.id+' refund recorded');render()}
function voidInv(k){const i=invs[k];if(i.pays.length)return toast('Refund recorded payments before voiding');i.voided=true;setSt(i);stockIn(i.items);logE(i.id,'Invoice voided (was '+fmt(i.a)+' to '+i.client+')');toast(i.id+' voided');render()}
const AQ=[['overdue','Which invoices are overdue?'],['owed','How much am I owed?'],['refunds','Summarize my refunds'],['ledger','Is my ledger balanced?']];
function initAns(){delete answers.dining;
answers.overdue=()=>{const o=invs.filter(i=>invSt(i)==='overdue');return o.length?o.map(i=>`<b>${i.id}</b> ${esc(i.client)}: ${fmt(dueAmt(i))} (due ${i.due})`).join('<br>'):'No invoices are overdue.'};
answers.owed=()=>{const a=invs.filter(i=>dueAmt(i)>0);return a.length?`You are owed <b>${fmt(R2(a.reduce((s,i)=>s+dueAmt(i),0)))}</b> across ${a.length} invoice${a.length>1?'s':''}.`:'Nothing is outstanding right now.'};
answers.refunds=()=>{const r=invs.reduce((s,i)=>s+i.refs.length,0),t=R2(invs.reduce((s,i)=>s+refAmt(i),0));return r?`${r} refund${r>1?'s':''} recorded, totaling <b>${fmt(t)}</b>.`:'No refunds have been recorded.'};
answers.ledger=()=>{const n=R2(txs.reduce((s,t)=>s+(t.dir==='in'?t.a:-t.a),0));return n===balance?`Yes. ${txs.length} ledger entries add up to ${fmt(balance)}.`:'Mismatch: entries and balance differ. Review the Audit tab.'};
answers.afford=()=>{const o=buys.filter(b=>!b.done&&balance>=b.cost).sort((a,b)=>PRI[a.pri]-PRI[b.pri]);return o.length?'With a ledger balance of '+fmt(balance)+', you can cover: '+o.map(b=>'<b>'+esc(b.name)+'</b> ('+fmt(b.cost)+')').join(', ')+'.':buys.some(b=>!b.done)?'Nothing on your goals list fits your balance of '+fmt(balance)+' yet.':'You have no purchase goals yet. Add one in Goals.'};
answers.budget=answers.afford;AQ.push(['afford','What can I afford to buy next?']);
answers.dueBills=()=>{const a=bills.filter(b=>!b.done&&daysTo(b.due)<=14).sort((x,y)=>x.due.localeCompare(y.due));return a.length?a.map(b=>'<b>'+esc(b.name)+'</b>: '+fmt(b.a)+' ('+(daysTo(b.due)<0?'overdue since ':'due ')+b.due+')').join('<br>'):bills.some(b=>!b.done)?'No bills are due in the next 14 days.':'You have no bills tracked yet. Add one in Bills.'};AQ.push(['dueBills','Which bills are due soon?']);}

// ----- optional commission: percent, fixed per sale, or fixed per item -----
let cmItems={};
const cmOf=e=>e.cm||(e.com?{t:'pct',v:e.com}:{t:'none'});
function commOf(e,sl,sold){const c=cmOf(e);if(c.t==='pct')return R2(sold*(c.v||0)/100);if(c.t==='fixed')return R2(sl.length*(c.v||0));if(c.t==='item')return R2(sl.reduce((a,s)=>a+s.items.reduce((b,x)=>b+Math.max(0,x.qty-(x.rq||0))*((c.items||{})[x.pid]||0),0),0));return 0}
function commTxt(e){const c=cmOf(e);return c.t==='pct'?c.v+'% commission':c.t==='fixed'?fmt(c.v)+' per sale':c.t==='item'?'Per-item commission':''}
function cmUI(v){const t=$('#cmt').value,b=$('#cmbox');if(t==='none'){b.innerHTML='';return}if(t==='item'){b.innerHTML=products.length?`<div class='mut' style='margin-bottom:6px'>Amount earned per unit sold (leave blank for none)</div>`+products.map(p=>`<div class='row' style='margin-bottom:6px'><span style='min-width:0'>${esc(p.name)}<span class='mut'> \u00b7 ${fmt(p.price)}</span></span><input class='cmi amt' data-pid='${p.id}' type='text' autocomplete='off' placeholder='0' value='${cmItems[p.id]||''}' style='width:110px;margin:0'></div>`).join(''):`<div class='mut' style='margin-bottom:10px'>Add products first, then set an amount for each.</div>`;return}b.innerHTML=`<input id='cmv' type='number' step='any' placeholder='${t==='pct'?'Percent of sales (e.g. 2)':'Amount per sale ('+CS()+')'}' value='${v||''}'>`}
function cmInit(e){const c=e?cmOf(e):{t:'none'};cmItems=Object.assign({},c.items||{});$('#cmt').value=c.t;cmUI(c.v)}
function cmRead(){const t=$('#cmt').value;if(t==='none')return {t:'none'};if(t==='item'){const it={};document.querySelectorAll('.cmi').forEach(e=>{const v=NUM(e.value);if(v>0)it[e.dataset.pid]=R2(v)});if(!Object.keys(it).length){toast('Enter an amount for at least one item');return false}return {t,items:it}}const v=parseFloat($('#cmv').value);if(!(v>=0)){toast('Enter the commission amount');return false}if(t==='pct'&&v>100){toast('Percent must be 0-100');return false}return {t,v}}

var UM={kg:['g',1000],g:['g',1],l:['ml',1000],ml:['ml',1],pcs:['pcs',1]},UL={kg:'kg',g:'g',l:'L',ml:'ml',pcs:'pcs'};
function R6(n){return Math.round(n*1e6)/1e6}
function R9(n){return Math.round(n*1e9)/1e9}
function n3(n){return Math.round(n*1000)/1000}
function idu(i){return i.du||(i.unit==='pcs'?'pcs':i.unit)}

const from24=t=>{if(!t)return {h:'',m:'00',p:'AM'};const [H,M]=t.split(':').map(Number);return {h:String((H%12)||12),m:pad(M,2),p:H<12?'AM':'PM'}};
const tmin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const mt=n=>{n=((Math.round(n)%1440)+1440)%1440;return pad(Math.floor(n/60),2)+':'+pad(n%60,2)};

function shCalc(){const S=to24(sh.s),E=to24(sh.e),H=parseFloat(sh.hrs),okH=H>0&&H<=24;let r={s:S,e:E,h:okH?H:0};if(sh.mode==='sh'){r.e=(S&&okH)?mt(tmin(S)+H*60):''}else if(sh.mode==='eh'){r.s=(E&&okH)?mt(tmin(E)-H*60):''}else{r.h=(S&&E&&S!==E)?((tmin(E)-tmin(S)+1440)%1440)/60:0}return r}

function shMode(m){const r=shCalc();if(r.s)sh.s=from24(r.s);if(r.e)sh.e=from24(r.e);if(r.h)sh.hrs=String(+r.h.toFixed(2));sh.mode=m;shDraw()}

function shFinal(){const r=shCalc(),S=to24(sh.s),E=to24(sh.e),H=parseFloat(sh.hrs),none=!S&&!E&&!(sh.hrs||'').trim()||(sh.mode==='sh'&&!S&&!(sh.hrs||'').trim())||(sh.mode==='eh'&&!E&&!(sh.hrs||'').trim());if(none)return {start:'',end:''};if(sh.mode==='sh'){if(!S||!(H>0))return {err:'Pick a start time and enter the hours, or clear the shift'};if(H>24)return {err:'A shift cannot be more than 24 hours'}}else if(sh.mode==='eh'){if(!E||!(H>0))return {err:'Pick an end time and enter the hours, or clear the shift'};if(H>24)return {err:'A shift cannot be more than 24 hours'}}else{if(!S||!E)return {err:'Pick both a start and an end time, or clear the shift'};if(S===E)return {err:'Shift start and end are the same'}}return {start:r.s,end:r.e}}

function lvCancel(id){const e=me(),l=LVR.find(x=>x.id===id);if(!e||!l||l.emp!==e.id||l.st!=='pending')return render();l.st='cancelled';logE(id,e.name+' cancelled their request');toast('Request cancelled');render()}
function lvDecide(id,ok){if(!canBoard())return toast('Only owners and managers can decide requests');const l=LVR.find(x=>x.id===id);if(!l||l.st!=='pending')return render();const dn=(($('#lvd_'+id)||{}).value||'').trim().slice(0,120);l.st=ok?'approved':'declined';l.by=curName();l.at=Date.now();l.dnote=dn;l.seen=false;l.n=ok?lvApply(l):0;logE(id,(ok?'Approved':'Declined')+' by '+curName()+' for '+l.name+', '+lvRange(l)+(ok?' ('+l.n+' day'+(l.n===1?'':'s')+' marked on attendance)':''));toast(ok?(l.n?'Approved. '+l.n+' day'+(l.n===1?'':'s')+' marked on attendance':'Approved. No days changed (days off or already marked)'):'Request declined');render()}
function lvCard(l,adm){const s=LVS[l.st],dec=l.st!=='pending'&&l.by?`<div class='mut' style='font-size:12px;margin-top:4px'>${l.st==='approved'?'Approved':'Declined'} by ${esc(l.by)}${l.at?' \u00b7 '+tsf(new Date(l.at)):''}${l.dnote?' \u00b7 \u201c'+esc(l.dnote)+'\u201d':''}${l.st==='approved'?' \u00b7 '+l.n+' day'+(l.n===1?'':'s')+' marked':''}</div>`:'',act=l.st==='pending'?(adm?`<input id='lvd_${l.id}' maxlength='120' placeholder='Reply note (optional)' style='margin-top:8px'><div class='row' style='justify-content:flex-start;gap:8px'><button class='btn' onclick='lvDecide("${l.id}",true)'>Approve</button><button class='btn o' onclick='lvDecide("${l.id}",false)'>Decline</button></div>`:`<div style='margin-top:8px'><button class='btn o' onclick='lvCancel("${l.id}")'>Cancel request</button></div>`):'';return `<div class='card'><div class='row' style='align-items:flex-start;gap:8px'><div style='min-width:0'><b>${adm?esc(l.name)+' \u00b7 ':''}${LVT[l.type][0]}</b><div class='mut'>${lvRange(l)} \u00b7 ${l.id}</div>${l.note?`<div class='mut' style='font-size:12px'>${esc(l.note)}</div>`:''}</div><span class='chip' style='background:${s[1]};color:${s[2]};font-size:11px;padding:2px 9px;flex:none'>${s[0]}</span></div>${dec}${act}</div>`}

// ---- payslips ----
function slipFrom(e,ym,w,paid){return {id:'',emp:e.id,name:e.name,role:e.role||'',ym,type:e.type,rate:e.rate,dd:w.dd,c:Object.assign({},w.c),base:w.base,comm:w.comm,ot:w.ot,otPay:w.otPay,cv:w.cv,tips:w.tips||0,sold:w.sold,total:w.total,ts:paid?paid.ts:0,by:paid?paid.by:''}}
function mySlips(e){Object.keys(wpaid).forEach(k=>{if(k.indexOf(e.id+'|')!==0)return;const ym=k.slice(e.id.length+1);if(SLP.some(x=>x.emp===e.id&&x.ym===ym))return;const sp=slipFrom(e,ym,calcW(e,ym),null);sp.total=wpaid[k].a;sp.id='PS-'+pad(++bdP,3);SLP.push(sp)});return SLP.filter(x=>x.emp===e.id).sort((a,b)=>b.ym<a.ym?-1:1)}
function slipObj(id){const e=me();if(!e)return null;if(id==='live'){if(!EP('earnings'))return null;return Object.assign(slipFrom(e,ymOf(0),calcW(e,ymOf(0)),null),{id:'ESTIMATE',live:true})}return SLP.find(x=>x.id===id&&x.emp===e.id)||null}
function slipHtml(o){const r=(l,v,b)=>`<div${b?" style='font-weight:700;font-size:15px'":''}><span>${l}</span><span>${v}</span></div>`;return `<div style='display:flex;justify-content:space-between;gap:10px'><div><div style='font-weight:700;font-size:16px'>${esc(prof.biz||prof.name)}</div></div><div style='text-align:right'><div style='font-size:20px;font-weight:800;letter-spacing:1px'>PAYSLIP</div><div>${esc(o.id)}</div></div></div><div style='display:flex;justify-content:space-between;gap:10px;margin:14px 0'><div><div class='sk'>EMPLOYEE</div><b>${esc(o.name)}</b>${o.role?`<div class='sk'>${esc(o.role)}</div>`:''}</div><div style='text-align:right'><div class='sk'>PERIOD</div><b>${ymTitle(o.ym)}</b><div style='margin-top:6px'><b class='stp'>${o.live?'ESTIMATE':'PAID'}</b></div>${!o.live&&o.ts?`<div class='sk'>${tsf(new Date(o.ts))}</div>`:''}</div></div><div class='tot'>${r('Pay basis',fmt(o.rate)+(o.type==='daily'?' per day':' per month'))}${r('Attendance','Present '+o.c.P+' \u00b7 Half '+o.c.H+' \u00b7 Paid off '+o.c.O+' \u00b7 Absent '+o.c.A)}${r('Paid days',o.dd)}${o.ot?r('Overtime days (off days worked)',o.ot):''}${o.ot?r('Overtime pay (included in base)',fmt(o.otPay)):''}${o.cv?r('Absence days covered',o.cv):''}${r('Base pay',fmt(o.base))}${r('Commission (sales '+fmt(o.sold)+')',fmt(o.comm))}${r('Total pay',fmt(o.total),1)}${o.tips>0?r('Tips collected (not part of wages)',fmt(o.tips)):''}</div><div class='sk' style='margin-top:14px'>${o.live?'This is an estimate and can change until wages are recorded as paid. ':''}Generated by Kovra. This is a pay record; Kovra does not process payments.</div>`}
function slipText(o){const L=[(prof.biz||prof.name)+' - PAYSLIP '+o.id,o.name+(o.role?' ('+o.role+')':''),'Period: '+ymTitle(o.ym),'Status: '+(o.live?'ESTIMATE (not yet paid)':'PAID'+(o.ts?' on '+tsf(new Date(o.ts)):'')),'','Pay basis: '+fmt(o.rate)+(o.type==='daily'?' per day':' per month'),'Paid days: '+o.dd];if(o.ot)L.push('Overtime days: '+o.ot+' (pay '+fmt(o.otPay)+' included in base)');L.push('Base pay: '+fmt(o.base),'Commission: '+fmt(o.comm)+' (sales '+fmt(o.sold)+')','Total pay: '+fmt(o.total));if(o.tips>0)L.push('Tips collected (not part of wages): '+fmt(o.tips));return L.join(NL)}
function openSlip(id){const o=slipObj(id);if(!o)return toast('Payslip not found');$('#sbody').innerHTML=`<div class='row'><h3>${esc(o.id)}</h3><button class='go xb' aria-label='Close' onclick='closeS()'></button></div><div class='paper' style='margin:12px 0'>${slipHtml(o)}</div><div class='row' style='justify-content:flex-start;flex-wrap:wrap'><button class='btn' onclick='printSlip("${id}")'>Print / Save PDF</button><button class='btn o' onclick='copySlip("${id}")'>Copy</button><button class='btn o' onclick='closeS()'>Done</button></div>`;$('#sheet').classList.add('show')}
function printSlip(id){const o=slipObj(id);if(!o)return;$('#printarea').innerHTML=`<div class='paper'>${slipHtml(o)}</div>`;toast('Choose Save as PDF in the print dialog for a PDF');try{window.print()}catch(e){toast('Printing is blocked here. Use Copy instead.')}}
function copySlip(id){const o=slipObj(id);if(!o)return;try{navigator.clipboard.writeText(slipText(o)).then(()=>toast('Payslip copied'),()=>toast('Copy blocked by browser'))}catch(e){toast('Copy not available here')}}

// ---- pages ----
function boardTeaser(){const e=me(),n=bdUnread(),top=bdSort()[0],upd=e?infoUnseen(e).length+LVR.filter(l=>l.emp===e.id&&l.st!=='pending'&&l.seen===false).length+CHR.filter(r=>r.emp===e.id&&r.st!=='pending'&&r.seen===false).length:0,ua=e?NTC.filter(x=>!(x.ack&&x.ack[e.id])).length:0;return `<div class='card'><div class='row'><div style='min-width:0'><b>\ud83d\udccc Notice board</b><div class='mut'>${top?esc(top.t):'No notices yet'}${n?' \u00b7 <b style="color:var(--blue)">'+n+' new</b>':''}${ua?' \u00b7 '+ua+' to acknowledge':''}${upd?' \u00b7 '+upd+' update'+(upd>1?'s':''):''}</div></div><button class='btn' onclick='go("board")'>Open</button></div></div>`}
function boardView(){const e=me(),adm=canBoard(),seen=e?(bdSeen[e.id]||0):0,list=bdSort();let h=`<div class='card' style='margin-top:12px'><h3>Notice board</h3><div class='mut'>Updates from your owner and managers.</div>${adm?`<button class='btn' style='margin-top:10px' onclick='openNotice()'>+ Post notice</button>`:''}</div>${list.length?list.map(n=>bdNoticeCard(n,adm,!adm&&n.ts>seen)).join(''):`<div class='card mut' style='text-align:center'>No notices yet.</div>`}`;if(!adm){if(!e)h+=`<div class='card mut' style='text-align:center'>Ask the owner to link you to a staff profile to request leave and see payslips.</div>`;else{const mine=LVR.filter(l=>l.emp===e.id).slice().reverse(),sl=mySlips(e);h+=`${INF.filter(x=>x.emp===e.id).slice(-5).reverse().map(infoCard).join('')}${myInfoSection(e)}<div class='sec'><h3>Leave &amp; absence</h3></div><div class='card'><button class='btn' onclick='openLeave()'>Request leave / absence</button></div>${mine.length?mine.map(l=>lvCard(l,false)).join(''):`<div class='card mut' style='text-align:center'>No requests yet.</div>`}<div class='sec'><h3>My payslips</h3></div>${EP('earnings')?`<div class='card' style='cursor:pointer' onclick='openSlip("live")'><div class='row'><div><b>${ymTitle(ymOf(0))}</b><div class='mut'>Current month, estimate so far</div></div><span class='chip' style='font-size:11px;padding:2px 9px;background:#fff3cf;color:#8a6500'>Estimate</span></div></div>`:''}${sl.length?sl.map(x=>`<div class='card' style='cursor:pointer' onclick='openSlip("${x.id}")'><div class='row'><div><b>${ymTitle(x.ym)}</b><div class='mut'>${x.id}${x.ts?' \u00b7 paid '+tsf(new Date(x.ts)):''}</div></div><div style='text-align:right'><b>${fmt(x.total)}</b><div><span class='chip' style='font-size:11px;padding:2px 9px'>Paid</span></div></div></div></div>`).join(''):`<div class='card mut' style='text-align:center'>No payslips yet. One is created each time your wages are recorded as paid.</div>`}`;bdSeen[e.id]=Date.now();INF.forEach(x=>{if(x.emp===e.id)x.seen=true});LVR.forEach(l=>{if(l.emp===e.id)l.seen=true});CHR.forEach(r=>{if(r.emp===e.id)r.seen=true})}}return h}
function hrAdmin(){if(!canBoard())return '';const pend=LVR.filter(l=>l.st==='pending'),rec=LVR.filter(l=>l.st!=='pending').slice(-5).reverse(),list=bdSort();return `<div class='card'><div class='row'><div><b>\ud83d\udccc Notice board</b><div class='mut'>${list.length} notice${list.length===1?'':'s'} visible to employees</div></div><button class='btn' onclick='openNotice()'>+ Post notice</button></div></div>${list.slice(0,5).map(n=>bdNoticeCard(n,true,false)).join('')}${list.length>5?`<div class='mut' style='text-align:center;margin-bottom:8px'>${list.length-5} older notice${list.length-5===1?'':'s'} not shown. Delete old ones to see them here.</div>`:''}<div class='sec'><h3>Leave requests${pend.length?' ('+pend.length+' pending)':''}</h3></div>${pend.length?pend.map(l=>lvCard(l,true)).join(''):`<div class='card mut' style='text-align:center'>No pending requests.</div>`}${rec.length?`<div class='mut' style='margin:8px 4px 4px'>Recent decisions</div>${rec.map(l=>lvCard(l,true)).join('')}`:''}${chAdmin()}`}

// ===== Employee change requests: address, bank account, ID card =====
let CHR=[],bdC=0,chTmp={},CHM=[],bdM=0,chOpen='',chDirty=false;
const CHT={address:'Address',bank:'Bank account',id:'ID card'};
const maskAcct=a=>{a=String(a||'');return a?'\u2022\u2022\u2022\u2022 '+a.slice(-4):'Not set'};
const TAREA="width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;font-family:inherit;margin-bottom:8px;resize:vertical";
function chCur(e,type){if(type==='address')return {addr:e.addr||''};if(type==='bank')return {bankName:e.bankName||'',acctName:e.acctName||'',acctNo:e.acctNo||''};return {idNo:e.idNo||'',hasImg:!!e.idImg,hasImgB:!!e.idImgB}}
function pickIdPhoto(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Choose an image file');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>toast('Could not read that image');im.src=r.result};r.readAsDataURL(f)};i.click()}
function idPrev(){const a=$('#chpi');if(!a)return;const t=(d,l)=>d?`<div style='text-align:center'><img onclick='viewImg(this.src)' title='Tap to enlarge' src='${d}' alt='${l}' style='max-width:100%;max-height:120px;border-radius:10px;border:1px solid var(--line)'><div class='mut' style='font-size:11px'>${l}</div></div>`:'';a.innerHTML=`<div style='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px'>${t(chTmp.img,'Front')}${t(chTmp.imgB,'Back')}</div>`}
function chPhoto(side){pickIdPhoto(d=>{if(side==='b')chTmp.imgB=d;else chTmp.img=d;idPrev()})}

// ---- employee side ----
function myInfoCard(e){const row=(l,v,t)=>`<div class='row' style='padding:8px 0;border-top:1px solid var(--line);align-items:flex-start;gap:8px'><div style='min-width:0'><div class='mut' style='font-size:12px'>${l}</div><div style='white-space:pre-wrap'>${v}</div></div><button class='btn o' style='padding:5px 12px;font-size:12px;flex:none' onclick='openChange("${t}")'>Request change</button></div>`,none='<span class="mut">Not set</span>';return `<div class='card'><h3 style='margin-bottom:2px'>My information</h3><div class='mut' style='font-size:12px;margin-bottom:6px'>Changes are sent to your owner or manager for approval.</div>${row('Address',e.addr?esc(e.addr):none,'address')}${row('Bank account',e.acctNo?esc(e.bankName||'Bank')+' \u00b7 '+esc(e.acctName||'')+'<br>'+maskAcct(e.acctNo):none,'bank')}${row('ID card',(e.idNo?esc(e.idNo):'<span class="mut">No number</span>')+idThumbs(e),'id')}</div>`}
function myInfoSection(e){const mine=CHR.filter(r=>r.emp===e.id).slice().reverse();return myInfoCard(e)+(mine.length?`<div class='mut' style='margin:8px 4px 4px'>My change requests</div>${mine.map(r=>chCard(r,false)).join('')}`:'')}
function openChange(type){const e=me();if(!e)return toast('Ask the owner to link you to a staff profile');if(!CHM[type])return;if(CHR.some(r=>r.emp===e.id&&r.type===type&&r.st==='pending'))return toast('You already have a pending '+CHM[type].toLowerCase()+' request. Cancel it first to send a new one');chTmp={img:'',imgB:''};const c=chCur(e,type);let f='';if(type==='address')f=`<div class='mut'>New address</div><textarea id='chad' maxlength='200' rows='3' placeholder='Street, area, city' style='${TAREA}'>${esc(c.addr)}</textarea>`;else if(type==='bank')f=`<input id='chbn' maxlength='60' placeholder='Bank name' value='${escA(c.bankName)}'><input id='chan' maxlength='60' placeholder='Account holder name' value='${escA(c.acctName||e.name)}'><input id='chac' maxlength='40' autocomplete='off' placeholder='New account number / IBAN'>`;else f=`<input id='chid' maxlength='30' autocomplete='off' placeholder='ID card number' value='${escA(c.idNo)}'><div class='row' style='justify-content:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px'><button class='btn o' onclick='chPhoto("f")'>Add ID card front</button><button class='btn o' onclick='chPhoto("b")'>Add ID card back</button></div><div class='mut' style='font-size:12px;margin-bottom:8px'>${c.hasImg||c.hasImgB?'Your current pictures stay unless you add new ones.':'No pictures on file yet.'}</div><div id='chpi'></div>`;$('#sbody').innerHTML=`<div class='row'><h3>Change ${CHM[type].toLowerCase()}</h3><button class='go xb' aria-label='Close' onclick='closeS()'></button></div><div class='mut' style='margin:6px 0 12px'>Your owner or manager reviews this before your record is updated.</div>${f}<input id='chn' maxlength='200' placeholder='Note for your manager (optional)'><button class='btn' style='width:100%;padding:13px' onclick='submitChange("${type}")'>Send for approval</button>`;$('#sheet').classList.add('show')}
function submitChange(type){const e=me();if(!e)return toast('Ask the owner to link you to a staff profile');if(!CHM[type])return;if(CHR.some(r=>r.emp===e.id&&r.type===type&&r.st==='pending'))return toast('You already have a pending request of this kind');let data={};if(type==='address'){const a=$('#chad').value.trim();if(a.length<5)return toast('Enter your full address');if(a===(e.addr||''))return toast('That is already the address on file');data={addr:a.slice(0,200)}}else if(type==='bank'){const bn=$('#chbn').value.trim(),an=$('#chan').value.trim(),no=$('#chac').value.replace(/[\s-]/g,'');if(!bn)return toast('Enter the bank name');if(!an)return toast('Enter the account holder name');if(!/^[A-Za-z0-9]{6,34}$/.test(no))return toast('The account number should be 6 to 34 letters or digits');if(no.toUpperCase()===String(e.acctNo||'').toUpperCase()&&bn===(e.bankName||'')&&an===(e.acctName||''))return toast('Nothing has changed');data={bankName:bn.slice(0,60),acctName:an.slice(0,60),acctNo:no.toUpperCase()}}else{const n=$('#chid').value.trim();if(!n&&!chTmp.img&&!chTmp.imgB)return toast('Enter the ID number or add a picture');if(n&&!/^[A-Za-z0-9][A-Za-z0-9 \/-]{2,29}$/.test(n))return toast('Check the ID number: 3 to 30 letters, digits, spaces, - or /');if(n===(e.idNo||'')&&!chTmp.img&&!chTmp.imgB)return toast('Nothing has changed');if(n&&n!==(e.idNo||''))data.idNo=n;if(chTmp.img)data.idImg=chTmp.img;if(chTmp.imgB)data.idImgB=chTmp.imgB;if(!data.idNo&&!data.idImg&&!data.idImgB)return toast('Nothing has changed')}const r={id:'CR-'+pad(++bdC,3),emp:e.id,name:e.name,type,data,old:chCur(e,type),note:($('#chn').value||'').trim().slice(0,200),st:'pending',ts:Date.now(),by:'',at:0,dnote:'',seen:true};CHR.push(r);logE(r.id,e.name+' requested a change to their '+CHM[type].toLowerCase());chTmp={};closeS();toast('Request sent for approval');render()}
function chCancel(id){const e=me(),r=CHR.find(x=>x.id===id);if(!e||!r||r.emp!==e.id||r.st!=='pending')return render();r.st='cancelled';delete r.data.idImg;delete r.data.idImgB;logE(id,e.name+' cancelled their change request');toast('Request cancelled');render()}

// ---- approval ----
function chApply(r){const e=staff.find(x=>x.id===r.emp);if(!e)return false;if(r.type==='address')e.addr=r.data.addr;else if(r.type==='bank'){e.bankName=r.data.bankName;e.acctName=r.data.acctName;e.acctNo=r.data.acctNo}else{if(r.data.idNo)e.idNo=r.data.idNo;if(r.data.idImg)e.idImg=r.data.idImg;if(r.data.idImgB)e.idImgB=r.data.idImgB}return true}
function chDecide(id,ok){if(!canBoard())return toast('Only owners and managers can decide requests');const r=CHR.find(x=>x.id===id);if(!r||r.st!=='pending')return render();if(ok&&!chApply(r))return toast('That employee no longer exists');r.st=ok?'approved':'declined';r.by=curName();r.at=Date.now();r.dnote=(($('#chd_'+id)||{}).value||'').trim().slice(0,120);r.seen=false;r.hadImg=!!(r.data.idImg||r.data.idImgB);delete r.data.idImg;delete r.data.idImgB;logE(id,(ok?'Approved':'Declined')+' by '+curName()+': '+CHM[r.type].toLowerCase()+' change for '+r.name+(r.type==='bank'&&ok?' (account '+maskAcct(r.data.acctNo)+')':''));toast(ok?'Approved. '+r.name+"'s record is updated":'Request declined');render()}
function chDiff(r,adm){const v=x=>x?esc(x):'<span class="mut">\u2014</span>',row=(l,o,n)=>`<div style='margin-top:6px'><div class='mut' style='font-size:12px'>${l}</div><div class='mut' style='text-decoration:line-through;white-space:pre-wrap'>${o}</div><div style='white-space:pre-wrap'><b>${n}</b></div></div>`,ac=a=>a?(adm?esc(a):maskAcct(a)):'<span class="mut">\u2014</span>';if(r.type==='address')return row('Address',v(r.old.addr),v(r.data.addr));if(r.type==='bank')return row('Bank',v(r.old.bankName),v(r.data.bankName))+row('Account holder',v(r.old.acctName),v(r.data.acctName))+row('Account number',ac(r.old.acctNo),ac(r.data.acctNo));return (r.data.idNo!=null?row('ID number',v(r.old.idNo),v(r.data.idNo)):'')+idDiff(r)}
function idDiff(r){const im=(d,l)=>d?`<div><div class='mut' style='font-size:12px'>New ID ${l}</div><img onclick='viewImg(this.src)' title='Tap to enlarge' src='${d}' alt='New ID ${l}' style='max-width:100%;max-height:140px;border-radius:10px;border:1px solid var(--line);margin-top:4px'></div>`:'';const a=im(r.data.idImg,'front')+im(r.data.idImgB,'back');return a?`<div style='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px'>${a}</div>`:(r.hadImg?`<div class='mut' style='font-size:12px;margin-top:6px'>Includes new ID card picture(s)</div>`:'')}
function idThumbs(e){const t=(d,l)=>d?`<div style='text-align:center'><img onclick='viewImg(this.src)' title='Tap to enlarge' src='${d}' alt='ID ${l}' style='max-width:150px;max-height:90px;border-radius:8px;border:1px solid var(--line)'><div class='mut' style='font-size:11px'>${l}</div></div>`:'';const a=t(e.idImg,'Front')+t(e.idImgB,'Back');return a?`<div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:6px'>${a}</div>`:'<div class="mut">No picture</div>'}
